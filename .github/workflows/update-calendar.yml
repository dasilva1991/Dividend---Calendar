
name: Update Dividend Calendar

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Generate dividend calendar
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          python <<'PY'
          import os
          import sys
          import time
          import requests
          from datetime import date, datetime, timedelta, timezone

          API_KEY = os.environ.get("ALPHA_VANTAGE_API_KEY")

          if not API_KEY:
              sys.exit("Missing ALPHA_VANTAGE_API_KEY GitHub secret.")

          stocks = {
              "AG": "First Majestic Silver",
              "NEM": "Newmont",
              "MSFT": "Microsoft",
              "FCX": "Freeport-McMoRan",
              "ORCL": "Oracle",
              "NKE": "Nike",
              "CVX": "Chevron",
              "SONY": "Sony",
              "MA": "Mastercard",
              "C": "Citigroup",
              "AXP": "American Express",
              "ASML": "ASML Holding",
              "GOOGL": "Alphabet Class A",
          }

          today = date.today()
          end_date = today + timedelta(days=365)
          events = []
          errors = []

          for symbol, company in stocks.items():
              print(f"Checking {company} ({symbol})...")

              try:
                  response = requests.get(
                      "https://www.alphavantage.co/query",
                      params={
                          "function": "DIVIDENDS",
                          "symbol": symbol,
                          "apikey": API_KEY,
                      },
                      timeout=30,
                  )
                  response.raise_for_status()
                  result = response.json()

                  if "Error Message" in result:
                      raise ValueError(result["Error Message"])

                  if "Note" in result or "Information" in result:
                      raise ValueError(
                          result.get("Note") or result.get("Information")
                      )

                  if "data" not in result:
                      raise ValueError(
                          f"Unexpected API response: {str(result)[:300]}"
                      )

                  for dividend in result["data"]:
                      ex_date_text = dividend.get("ex_dividend_date")

                      if not ex_date_text:
                          continue

                      ex_date = date.fromisoformat(ex_date_text)

                      if today <= ex_date <= end_date:
                          amount = dividend.get("amount", "0")
                          currency = dividend.get("currency", "")

                          events.append({
                              "date": ex_date,
                              "symbol": symbol,
                              "company": company,
                              "amount": amount,
                              "currency": currency,
                              "payment_date": dividend.get("payment_date", ""),
                          })

                  print(f"  Successfully checked {symbol}")

              except Exception as exc:
                  message = f"{symbol}: {exc}"
                  print(f"  ERROR: {message}")
                  errors.append(message)

              time.sleep(2)

          if errors:
              print("\nSome companies could not be checked:")
              for error in errors:
                  print(f"- {error}")

              sys.exit(
                  "Calendar not updated because one or more API requests failed."
              )

          if not events:
              sys.exit(
                  "No upcoming dividends found. Existing calendar was not replaced."
              )

          events.sort(key=lambda item: (item["date"], item["symbol"]))

          def escape_ics(value):
              return (
                  str(value)
                  .replace("\\", "\\\\")
                  .replace(";", "\\;")
                  .replace(",", "\\,")
                  .replace("\n", "\\n")
              )

          def fold_line(line):
              parts = []
              current = ""

              for character in line:
                  if len((current + character).encode("utf-8")) > 73:
                      parts.append(current)
                      current = " " + character
                  else:
                      current += character

              parts.append(current)
              return "\r\n".join(parts)

          now = datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          lines = [
              "BEGIN:VCALENDAR",
              "VERSION:2.0",
              "PRODID:-//Dividend Calendar//EN",
              "CALSCALE:GREGORIAN",
              "METHOD:PUBLISH",
          ]

          for event in events:
              ex_date = event["date"].strftime("%Y%m%d")
              uid = (
                  f'{event["symbol"]}-{ex_date}'
                  "@dividend-calendar.github.io"
              )

              description = (
                  f'Ex-dividend date for {event["company"]} ({event["symbol"]}). '
                  f'Dividend amount reported: {event["amount"]} '
                  f'{event["currency"]}.'
              )

              if event["payment_date"]:
                  description += (
                      f' Payment date: {event["payment_date"]}.'
                  )

              lines.extend([
                  "BEGIN:VEVENT",
                  f"UID:{uid}",
                  f"DTSTAMP:{now}",
                  f"DTSTART;VALUE=DATE:{ex_date}",
                  f"DTEND;VALUE=DATE:"
                  f'{(event["date"] + timedelta(days=1)).strftime("%Y%m%d")}',
                  f'SUMMARY:{escape_ics(event["symbol"])} dividend ex-date',
                  f"DESCRIPTION:{escape_ics(description)}",
                  "END:VEVENT",
              ])

          lines.append("END:VCALENDAR")

          with open("dividends.ics", "w", encoding="utf-8", newline="") as file:
              file.write(
                  "\r\n".join(fold_line(line) for line in lines) + "\r\n"
              )

          print(f"\nCreated dividends.ics with {len(events)} events.")
          PY

      - name: Commit and push calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dividends.ics
          if git diff --cached --quiet; then
            echo "No calendar changes to commit."
          else
            git commit -m "Update dividend calendar"
            git push
          fi
